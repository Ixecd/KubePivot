apiVersion: v1
kind: ConfigMap
metadata:
  name: kp-system-config
  namespace: kubepivot-system
  labels:
    app.kubernetes.io/name: kubepivot-controller
    app.kubernetes.io/managed-by: kp
data:
  config.yaml: |
    controller:
      shards: 10
      replicas: 3
      workerPoolSize: 20
      taskTimeout: 90s
      reconcileInterval: 8s
      orphanSweeperInterval: 30s
      driftSyncInterval: 30s
      gracePeriod: 5s
      protectedNamespaces:
        - kube-system
        - kube-public
        - kubepivot-system
    leader:
      etcdTTL: 15s
      retryInterval: 3s
      leaseDuration: 15s
      leaseRenewInterval: 2s
    scheduler:
      rescheduleInterval: 5m
      maxMigrations: 0
      jitterThreshold: 0.95
      jitterWindow: 5m
      jitterSpikeCount: 3
    migration:
      evictTimeout: 10m
      waitReadyTimeout: 5m
      pausedBackoff: 30s
      maxRetries: 3
    kvcache:
      mergeThreshold: 200
      shardCount: 16
      staleWatchdogMaxStale: 5m
    etcd:
      compactInterval: 1h
      defragInterval: 24h
  # 兼容旧 sizing.go/apply.go 的 flat key（渐进废弃）
  shards: "10"
  replicas: "3"
  worker_pool_size: "20"
---
apiVersion: v1
kind: Service
metadata:
  name: kubepivot-controller
  namespace: kubepivot-system
  labels:
    app: kubepivot-controller
    app.kubernetes.io/name: kubepivot-controller
    app.kubernetes.io/managed-by: kp
spec:
  clusterIP: None  # headless — StatefulSet 需要稳定网络标识
  selector:
    app: kubepivot-controller
  ports:
    - name: etcd-client
      port: 2379
      targetPort: 2379
    - name: etcd-peer
      port: 2380
      targetPort: 2380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubepivot-controller
  namespace: kubepivot-system
  labels:
    app: kubepivot-controller
    app.kubernetes.io/name: kubepivot-controller
    app.kubernetes.io/managed-by: kp
spec:
  replicas: 3
  serviceName: kubepivot-controller
  podManagementPolicy: OrderedReady  # pod-0 先起 → etcd 自举
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kubepivot-controller
  template:
    metadata:
      labels:
        app: kubepivot-controller
    spec:
      serviceAccountName: kubepivot-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        # ── etcd Learner Sidecar ──────────────────────────────────────
        # 每个 Pod 内嵌一个 etcd 实例，构成 Learner 集群。
        # Pod-0 冷启动自举，Pod-N 以 Learner 身份加入再 promote。
        # kp 通过 localhost:2379 连接本地 etcd。
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.18
          imagePullPolicy: IfNotPresent
          command:
            - etcd
          args:
            - --name=$(POD_NAME)
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).kubepivot-controller.kubepivot-system.svc:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).kubepivot-controller.kubepivot-system.svc:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=kubepivot-etcd
            - --data-dir=/var/lib/etcd
            - --snapshot-count=10000
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
            - --max-request-bytes=10485760
            - --quota-backend-bytes=8589934592
            - --experimental-initial-corrupt-check=true
            - --experimental-corrupt-check-time=10m
            - --heartbeat-interval=200
            - --election-timeout=2000
            # 以上参数与 configs/system.yaml etcd.* 对齐
            # corrupt-check: 每10min巡检各节点boltdb hash一致性
            # heartbeat=200ms (默认100, 大规模集群调高省CPU)
            # election=2000ms (heartbeat×10, 避免网络抖动误触发选举)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/etcd
          livenessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 10
        # ── Controller ────────────────────────────────────────────────
        - name: controller
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/kp"]
          args: ["controller", "start", "--global"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: PATH
              value: "/usr/local/bin"
            - name: KUBEPIVOT_MODE
              value: "global"
            - name: ETCD_ENDPOINTS
              value: "http://localhost:2379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/kp
              readOnly: true
            - name: webhook-tls
              mountPath: /etc/kubepivot
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kp-system-config
        - name: webhook-tls
          secret:
            secretName: kubepivot-webhook-tls
        - name: tmp
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi