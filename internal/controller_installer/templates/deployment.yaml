apiVersion: v1
kind: ConfigMap
metadata:
  name: kubepivot-controller-config
  namespace: kubepivot-system
  labels:
    app.kubernetes.io/name: kubepivot-controller
    app.kubernetes.io/managed-by: kp
data:
  # Worker Pool 大小（可被 KUBEPIVOT_WORKER_POOL_SIZE env 覆盖）
  worker_pool_size: "20"
  # Leader Election 参数
  leader_ttl_seconds: "15"
  # Reconcile 周期
  reconcile_interval_seconds: "8"
  # ConfigMap watcher resync 周期（silent failure 保护）
  watcher_resync_seconds: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepivot-controller
  namespace: kubepivot-system
  labels:
    app: kubepivot-controller
    app.kubernetes.io/name: kubepivot-controller
    app.kubernetes.io/managed-by: kp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: kubepivot-controller
  template:
    metadata:
      labels:
        app: kubepivot-controller
    spec:
      serviceAccountName: kubepivot-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: controller
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/kp"]
          args: ["controller", "start", "--global"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: PATH
              value: "/usr/local/bin"
            - name: KUBEPIVOT_MODE
              value: "global"
            - name: KUBEPIVOT_WORKER_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: kubepivot-controller-config
                  key: worker_pool_size
            - name: LEADER_KEY
              value: "/kubepivot/global/leader"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory