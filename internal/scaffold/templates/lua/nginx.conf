events { worker_connections 1024; }
http {
    server {
        listen 8080;
        location /healthz {
            default_type application/json;
            content_by_lua_block { ngx.say('{"status":"ok"}') }
        }
        location / {
            default_type application/json;
            content_by_lua_block { ngx.say('{"service":"{{name}}","status":"ok"}') }
        }
    }
}
