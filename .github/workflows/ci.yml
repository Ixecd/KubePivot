name: CI

on:
  push:
    branches: [ main, Master ]
  pull_request:
    branches: [ main, Master ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Docker build dtk
        run: |
          docker build \
            -f build/docker/dtk/Dockerfile \
            -t dtk:ci \
            .