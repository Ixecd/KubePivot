# benchmark/chaos/kind-multi-node.yaml
# v3.4 规模化混沌测试 — 3 节点 Kind 集群
#
# 用法:
#   kind create cluster --name kp-chaos --config benchmark/chaos/kind-multi-node.yaml
#   kind delete cluster --name kp-chaos
#
# 节点: 1 control-plane + 2 worker
# 端口: 80/443 → localhost (用于 ingress/controller webhook)

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
